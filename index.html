<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina</title>
  <meta name="description" content="A screen for images, PDFs, and video, with the time, date, and weather.">
  <meta name="theme-color" content="#090a07">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d6ff4a'/%3E%3Crect x='7' y='10' width='18' height='3' rx='1' fill='%2314160c'/%3E%3Crect x='7' y='17' width='12' height='3' rx='1' fill='%2314160c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    if (new URLSearchParams(location.search).has('embed')) {
      document.documentElement.classList.add('is-embed');
    }
  </script>
</head>
<body class="stage">
  <div class="layers" id="layers">
    <div class="layer" id="layer-a"></div>
    <div class="layer" id="layer-b"></div>
  </div>

  <div class="centerpiece" id="centerpiece">
    <p class="brand-kicker">Lumina</p>
    <p class="kicker" data-screen-name hidden></p>
    <div class="hero-time" data-time aria-live="off">–:–</div>
    <div class="hero-date" data-date aria-live="off"></div>
    <div class="center-weather" data-weather hidden></div>
    <p class="ready" id="ready-copy">Loading the playlist…</p>
    <a class="ready-link" href="admin.html">Open studio</a>
  </div>

  <aside class="hud hud-bottom-left" data-hud>
    <div class="hud-card" data-clock-card>
      <p class="kicker" data-screen-name hidden></p>
      <div class="hud-time" data-time aria-live="off">–:–</div>
      <div class="hud-date" data-date aria-live="off"></div>
    </div>
    <div class="hud-card hud-weather" data-weather hidden></div>
  </aside>

  <div class="progress" id="progress" hidden><span></span></div>

  <div class="chrome">
    <span id="counter" class="counter"></span>
    <a class="studio-link" href="admin.html">Studio</a>
    <button type="button" id="fullscreen">Full screen</button>
  </div>
  <button class="hit hit-prev" id="prev-item" type="button" aria-label="Previous item"><span aria-hidden="true">‹</span></button>
  <button class="hit hit-next" id="next-item" type="button" aria-label="Next item"><span aria-hidden="true">›</span></button>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <p id="needs-http" class="needs-http" hidden>If this page stays empty, open it from a web server instead of a file.</p>
  <script>
    setTimeout(() => {
      const note = document.getElementById('needs-http');
      if (note) note.hidden = false;
    }, 2500);
  </script>
  <script type="module" src="assets/js/player.js"></script>
</body>
</html>
