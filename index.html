<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="道況 — Live Hong Kong traffic cameras, special traffic news, and road conditions from Transport Department open data."
    />
    <title>道況 · HK Traffic</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1c2c'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23f0a202'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="app">
      <div id="map" aria-label="Hong Kong traffic map"></div>

      <header class="brand-bar">
        <div class="brand">
          <p class="brand-mark">道況</p>
          <p class="brand-sub">HK Traffic Live</p>
        </div>
        <div class="brand-meta">
          <span id="clock" class="clock">--:--</span>
          <span id="status-pill" class="status-pill is-loading">Syncing…</span>
        </div>
      </header>

      <aside class="panel" id="panel">
        <div class="panel-section">
          <label class="field-label" for="search">Find a camera</label>
          <input
            id="search"
            type="search"
            placeholder="e.g. Cross Harbour, Nathan Road…"
            autocomplete="off"
          />
        </div>

        <div class="panel-section">
          <div class="section-head">
            <h2>Regions</h2>
            <button type="button" id="clear-filters" class="text-btn">Clear</button>
          </div>
          <div id="region-filters" class="chip-row" role="group" aria-label="Filter by region"></div>
        </div>

        <div class="panel-section camera-section is-empty" id="camera-section">
          <div class="section-head">
            <h2>Live view</h2>
            <button type="button" id="close-camera" class="text-btn">Close</button>
          </div>
          <div id="camera-detail" class="camera-detail"></div>
        </div>

        <div class="panel-section">
          <div class="section-head">
            <h2>Cameras <span id="camera-count" class="count-pill">0</span></h2>
          </div>
          <div id="camera-list" class="camera-list" aria-label="Matching cameras"></div>
        </div>

        <div class="panel-section">
          <div class="section-head">
            <h2>Special traffic news</h2>
            <button type="button" id="refresh-btn" class="text-btn">Refresh</button>
          </div>
          <div id="news-list" class="news-list" aria-live="polite">
            <p class="muted">Loading Transport Department notices…</p>
          </div>
        </div>

        <footer class="panel-foot">
          Data from Hong Kong Transport Department / data.gov.hk. Snapshots refresh about every 2 minutes.
        </footer>
      </aside>

      <div class="mobile-tabs" role="tablist">
        <button type="button" class="tab is-active" data-view="map">Map</button>
        <button type="button" class="tab" data-view="panel">News &amp; cameras</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
